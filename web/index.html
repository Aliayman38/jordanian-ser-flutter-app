<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تحدي الصوت الأردني - منصة جمع البيانات الصوتية لتدريب نماذج الذكاء الاصطناعي على تمييز المشاعر باللهجة الأردنية">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تحدي الصوت الأردني">
  <meta name="theme-color" content="#006D5B">

  <!-- Responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تحدي الصوت الأردني | Jordanian SER</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Cairo & Noto Sans Arabic for crisp Arabic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F6FAF8;
      font-family: 'Cairo', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #006D5B;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 109, 91, 0.15);
      border-top: 4px solid #006D5B;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-title {
      font-size: 20px;
      font-weight: 800;
      color: #102A24;
    }
    .loading-subtitle {
      font-size: 14px;
      color: #536E67;
      font-weight: 600;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">🇯🇴 تحدي الصوت الأردني</div>
    <div class="loading-subtitle">جاري تحميل المنصة...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
